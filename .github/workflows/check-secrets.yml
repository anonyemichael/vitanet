# Lists the NAMES of the repository secrets (never the values) so Claude can see what is set up for deploying.
# Runs when this file changes on a work branch, or by hand: Actions -> check-secrets -> Run workflow.
name: check-secrets
on:
  workflow_dispatch:
  push:
    branches: ["vitanet-ai-tools", "ccr-*"]
    paths: [".github/workflows/check-secrets.yml"]
permissions:
  contents: read
jobs:
  names:
    runs-on: ubuntu-latest
    steps:
      - name: Secret names (values are never printed)
        env:
          ALL: ${{ toJSON(secrets) }}
        run: |
          echo "$ALL" | jq -r 'keys[]' | grep -v '^github_token$' | sort | sed 's/^/secret: /'
          echo "$ALL" | jq -r 'to_entries[] | select(.key|test("SERVICE_ACCOUNT|GCP|GOOGLE|FIREBASE")) | "\(.key) looks like JSON key: \(.value|startswith("{"))"'
