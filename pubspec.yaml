name: vitanet
description: "VitaNet - AI-Powered Health Triage Assistant"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.7.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.4
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  intl: ^0.19.0
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  flutter_markdown: ^0.7.6
  uuid: ^4.5.1
  firebase_core: ^4.12.1
  firebase_auth: ^6.5.6
  google_sign_in: ^6.2.1
  flutter_native_splash: ^2.4.7
  geolocator: ^14.0.2
  fl_chart: ^1.2.0
  cloud_firestore: ^6.7.1
  health: ^13.3.1
  flutter_dotenv: ^6.0.1
  image_picker: ^1.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/onboarding/
    - .env

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  web:
    generate: true
    image_path: "assets/logo.png"
    background_color: "#0A5C56"
    theme_color: "#0A5C56"
