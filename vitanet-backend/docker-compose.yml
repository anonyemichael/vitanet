version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: vitanet
      POSTGRES_PASSWORD: vitanetpassword
      POSTGRES_DB: vitanetdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
